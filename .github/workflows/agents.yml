# Runs the SOOTH agents for free on GitHub Actions. GitHub starts scheduled runs hours late on free
# repositories, so each run keeps the agents going for ~5h45m (a pass every minute) and the hourly
# schedule queues the next run behind it. Setup (secrets) and caveats: docs/agents-on-github.md.
name: agents

on:
  schedule:
    - cron: "17 * * * *" # queues the next run; concurrency keeps it waiting until this one ends
  workflow_dispatch: {}

# One run at a time: two runs signing with the same keys would fight over nonces and salts.
concurrency:
  group: agents
  cancel-in-progress: false

permissions:
  contents: write # to publish the evidence and deliverables the agents write

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # GitHub's job limit; the loop below stops 10 minutes before it at the latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      ATLAS_BOT_KEY: ${{ secrets.ATLAS_BOT_KEY }}
      NOVA_BOT_KEY: ${{ secrets.NOVA_BOT_KEY }}
      SAGE_BOT_KEY: ${{ secrets.SAGE_BOT_KEY }}
      ECHO_BOT_KEY: ${{ secrets.ECHO_BOT_KEY }}
      MALLORY_BOT_KEY: ${{ secrets.MALLORY_BOT_KEY }}
      CONTRACTOR_BOT_KEY: ${{ secrets.CONTRACTOR_BOT_KEY }}
      QUILL_BOT_KEY: ${{ secrets.QUILL_BOT_KEY }}
      LEDGER_BOT_KEY: ${{ secrets.LEDGER_BOT_KEY }}
      SHADE_BOT_KEY: ${{ secrets.SHADE_BOT_KEY }}
      SOOTHDEV_BOT_KEY: ${{ secrets.SOOTHDEV_BOT_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Salts of sealed answers and bids live in agents/.state between passes. Losing them means an
      # agent cannot reveal what it committed, and its stake is slashed, so the state is carried over.
      - name: Restore agent state
        uses: actions/cache/restore@v4
        with:
          path: agents/.state
          key: agent-state-${{ github.run_id }}
          restore-keys: agent-state-

      - name: Install
        run: npm ci
        working-directory: agents

      # Until the secrets are added (docs/agents-on-github.md) the loop is skipped, not failed.
      # New evidence, briefs and deliverables are stored by hash under web/public/d; pushing them
      # makes Vercel redeploy so the links on chain resolve, so they are published every pass.
      - name: Run the jury and the swarm
        if: ${{ env.ATLAS_BOT_KEY != '' && env.CONTRACTOR_BOT_KEY != '' }}
        working-directory: agents
        run: |
          git config user.name "sooth-agents"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # After 5h stop at the first idle moment; while a sealed answer or bid waits for its reveal,
          # keep going until 10 minutes before GitHub's 6h limit, so a late next run cannot cost a stake.
          start=$(date +%s); soft=$(( start + 300 * 60 )); hard=$(( start + 350 * 60 ))
          while now=$(date +%s); [ "$now" -lt "$hard" ] && { [ "$now" -lt "$soft" ] || node busy.mts; }; do
            node run.mts --once || echo "jury pass failed, retrying next minute"
            node swarm.mts --once || echo "swarm pass failed, retrying next minute"
            git add ../web/public/d
            if ! git diff --cached --quiet; then
              git commit -q -m "chore(agents): publish evidence and deliverables"
              git pull --rebase -q && git push -q || echo "publish failed, retrying next pass"
            fi
            sleep 60
          done

      - name: Save agent state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: agents/.state
          key: agent-state-${{ github.run_id }}
