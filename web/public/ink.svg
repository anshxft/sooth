<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Ink blot used as the theme-switch mask: a disc and a few droplets with torn, turbulent edges. -->
  <filter id="bleed" x="-25%" y="-25%" width="150%" height="150%">
    <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" seed="7" />
    <feDisplacementMap in="SourceGraphic" scale="30" />
  </filter>
  <g fill="#000" filter="url(#bleed)">
    <circle cx="100" cy="100" r="62" />
    <circle cx="158" cy="72" r="9" />
    <circle cx="44" cy="138" r="7" />
    <circle cx="132" cy="160" r="6" />
    <circle cx="60" cy="52" r="5" />
  </g>
</svg>
